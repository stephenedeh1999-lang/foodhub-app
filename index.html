<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🍔 FoodHub - Order Food</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header>
        <div class="header-container">
            <div class="logo">
                <span class="logo-icon">🍔</span>
                <span class="logo-text">Food<span>Hub</span></span>
            </div>
            <div class="header-actions">
                <span class="user-greeting" id="userGreeting">👤 Welcome</span>
                <button class="cart-btn" onclick="toggleCart()">
                    🛒 Cart <span id="cartCount">0</span>
                </button>
                <button class="logout-btn" onclick="handleLogout()">🚪 Logout</button>
            </div>
        </div>
    </header>

    <!-- ===== HERO SECTION ===== -->
    <section class="hero">
        <div class="hero-content">
            <h1>Delicious Food, <span>Delivered Fast</span></h1>
            <p>Order your favorite meals from top restaurants in your area</p>
        </div>
    </section>

    <!-- ===== MENU SECTION ===== -->
    <section class="menu-section">
        <div class="container">
            <h2>🍽️ Our Menu</h2>
            
            <!-- Category Tabs -->
            <div class="category-tabs" id="categoryTabs">
                <button class="category-btn active" data-category="all">🍽️ All</button>
                <button class="category-btn" data-category="american">🇺🇸 American</button>
                <button class="category-btn" data-category="african">🇳🇬 African</button>
                <button class="category-btn" data-category="rice">🍚 Rice</button>
                <button class="category-btn" data-category="soups">🥣 Soups</button>
                <button class="category-btn" data-category="swallows">🍲 Swallows</button>
                <button class="category-btn" data-category="snacks">🧆 Snacks</button>
                <button class="category-btn" data-category="drinks">🥤 Drinks</button>
            </div>

            <!-- Menu Grid -->
            <div class="menu-grid" id="menuGrid">
                <!-- Items will be loaded by JavaScript -->
            </div>
        </div>
    </section>

    <!-- ===== CART SIDEBAR ===== -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>🛒 Your Cart</h2>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p class="empty-cart">Your cart is empty. Start ordering!</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- ===== CHECKOUT MODAL ===== -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-content">
            <h2>📝 Place Your Order</h2>
            <form id="checkoutForm" onsubmit="placeOrder(event)">
                <input type="text" placeholder="Full Name" required />
                <input type="tel" placeholder="Phone Number" required />
                <input type="text" placeholder="Delivery Address" required />
                <textarea placeholder="Special instructions (optional)"></textarea>
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div id="orderSummaryItems"></div>
                    <div class="order-total">
                        <strong>Total: <span id="orderTotal">$0.00</span></strong>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="closeCheckout()">Cancel</button>
                    <button type="submit">✅ Place Order</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== SUCCESS TOAST ===== -->
    <div class="toast" id="toast">
        <span id="toastMessage">✅ Order placed successfully!</span>
    </div>

    <!-- ===== SCRIPT ===== -->
    <script src="script.js"></script>
</body>
</html>
